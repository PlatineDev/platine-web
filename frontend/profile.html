<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technician Profile — Platine Community</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/community.css">
</head>
<body>

<nav class="comm-nav" id="comm-nav"></nav>
<div class="profile-wrap" id="profile-wrap">
  <div class="empty-state"><div class="spinner" style="margin:0 auto"></div></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/community.js"></script>
<script>
const userId   = window.location.pathname.split('/').pop();
let activeTab  = 'posts';
let userData   = null;

renderNav();

async function loadProfile() {
  const wrap = document.getElementById('profile-wrap');
  try {
    userData = await CommunityAPI.user(userId);
    document.title = userData.email + ' — Platine Community';
    renderProfile();
  } catch {
    wrap.innerHTML = `<div class="empty-state">
      <div class="et">User not found</div>
      <div class="es"><a href="/community" style="color:var(--ac)">← Community</a></div>
    </div>`;
  }
}

function renderProfile() {
  const u    = userData;
  const wrap = document.getElementById('profile-wrap');
  const initial = (u.email || '?')[0].toUpperCase();
  const joined  = new Date(u.created_at + 'Z').toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const postsHtml = u.posts.length === 0
    ? `<div class="empty-state" style="padding:28px 0"><div class="es">No questions posted yet.</div></div>`
    : u.posts.map(p => `
        <div class="profile-item">
          <a href="/community/post/${p.id}" class="profile-item-title">${escHtml(p.title)}</a>
          <div class="profile-item-meta">
            ${p.is_solved ? '<span class="solved-badge">✓ Solved</span>' : ''}
            <span>${p.score} votes</span>
            <span>${p.answer_count} answer${p.answer_count !== 1 ? 's' : ''}</span>
            <span>${timeAgo(p.created_at)}</span>
          </div>
        </div>`).join('');

  const answersHtml = u.answers.length === 0
    ? `<div class="empty-state" style="padding:28px 0"><div class="es">No answers posted yet.</div></div>`
    : u.answers.map(a => `
        <div class="profile-item">
          <div style="font-size:11px;color:var(--tx3);margin-bottom:4px">
            On: <a href="/community/post/${a.post_id}" style="color:var(--tx2);text-decoration:none">${escHtml(a.post_title)}</a>
          </div>
          <div style="font-size:13px;color:var(--tx2);line-height:1.5">${escHtml(a.body)}</div>
          <div class="profile-item-meta">
            ${a.is_accepted ? '<span class="solved-badge">✓ Accepted</span>' : ''}
            <span>${a.score} votes</span>
            <span>${timeAgo(a.created_at)}</span>
          </div>
        </div>`).join('');

  wrap.innerHTML = `
    <a href="/community" class="back-link">← Community</a>

    <div class="profile-header">
      <div class="profile-avatar">${initial}</div>
      <div class="profile-info">
        <div class="profile-email">
          ${escHtml(u.email)}
          ${u.is_supporter ? '<span class="supporter-badge" style="margin-left:6px">Supporter</span>' : ''}
        </div>
        <div class="profile-joined">Member since ${joined}</div>
      </div>
      <div class="rep-block">
        <span class="rep-score">${u.reputation}</span>
        <span class="rep-label">reputation</span>
      </div>
    </div>

    <div class="profile-tabs">
      <button class="profile-tab ${activeTab === 'posts' ? 'active' : ''}"
        onclick="setTab('posts')">Questions (${u.posts.length})</button>
      <button class="profile-tab ${activeTab === 'answers' ? 'active' : ''}"
        onclick="setTab('answers')">Answers (${u.answers.length})</button>
    </div>

    <div id="tab-posts"   style="display:${activeTab === 'posts'   ? 'block' : 'none'}">${postsHtml}</div>
    <div id="tab-answers" style="display:${activeTab === 'answers' ? 'block' : 'none'}">${answersHtml}</div>
  `;
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.profile-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'posts') || (i === 1 && tab === 'answers'));
  });
  document.getElementById('tab-posts').style.display   = tab === 'posts'   ? 'block' : 'none';
  document.getElementById('tab-answers').style.display = tab === 'answers' ? 'block' : 'none';
}

loadProfile();
</script>
</body>
</html>
